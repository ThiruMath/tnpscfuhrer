name: "Current Affairs PDF Ingestion Pipeline"

on:
  push:
    paths:
      - 'uploads/**.pdf'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write # Needed to commit and push changes back to the repo

jobs:
  ingest-news:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Process PDF News and Generate Revision Set
      run: node scripts/process_news_pdf.mjs
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add public/data/news.json public/data/revision.json public/data/revision-history/ uploads/processed/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-process uploaded news PDFs and update revision set" && git push)
